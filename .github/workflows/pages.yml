name: Publier le site sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4
      - name: Preparer les fichiers du site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
