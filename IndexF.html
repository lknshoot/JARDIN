<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>🌲 Le Jardin des Compliments 🌲</title>
<style>
  :root {
    --pink-deep: #e6398f;
    --pink-soft: #ffd6e8;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: 'Comic Sans MS', 'Trebuchet MS', sans-serif;
    background: #87ceeb;
  }

  #scene {
    position: relative;
    width: 100%;
    height: 100vh;
    overflow: hidden;
  }

  /* --- CIEL --- */
  #sky {
    position: absolute;
    inset: 0;
    transition: background 3s ease;
    z-index: 0;
  }

  #light-overlay {
    position: absolute;
    inset: 0;
    z-index: 15;
    pointer-events: none;
    mix-blend-mode: overlay;
    transition: background 3s ease, opacity 3s ease;
  }

  #stars {
    position: absolute;
    inset: 0;
    z-index: 1;
    transition: opacity 2s ease;
  }
  .star {
    position: absolute;
    width: 2px;
    height: 2px;
    background: white;
    border-radius: 50%;
    animation: twinkle 2.5s ease-in-out infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.2; }
    50% { opacity: 1; }
  }

  #celestial {
    position: absolute;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    z-index: 2;
    transition: left 3s linear, top 3s linear, background 3s ease, box-shadow 3s ease, opacity 1s ease;
    pointer-events: none;
  }

  .cloud {
    position: absolute;
    font-size: 40px;
    z-index: 3;
    animation: float-cloud linear infinite;
    user-select: none;
    pointer-events: none;
    transition: opacity 2s ease, filter 2s ease;
  }
  @keyframes float-cloud {
    from { transform: translateX(-15vw); }
    to { transform: translateX(115vw); }
  }

  .bird {
    position: absolute;
    font-size: 20px;
    z-index: 4;
    animation: fly linear infinite;
    pointer-events: none;
  }
  @keyframes fly {
    from { transform: translateX(-10vw) translateY(0); }
    50% { transform: translateX(50vw) translateY(-20px); }
    to { transform: translateX(115vw) translateY(0); }
  }

  .firefly {
    position: absolute;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #fff6a0;
    box-shadow: 0 0 8px 3px #fff6a0aa;
    z-index: 9;
    animation: firefly-move 6s ease-in-out infinite;
    opacity: 0;
  }
  @keyframes firefly-move {
    0%   { transform: translate(0,0); opacity: 0; }
    20%  { opacity: 0.9; }
    50%  { transform: translate(20px,-25px); opacity: 0.3; }
    75%  { opacity: 0.9; }
    100% { transform: translate(-15px,10px); opacity: 0; }
  }

  /* --- FORET --- */
  #forest-back {
    position: absolute;
    bottom: 14%;
    left: 0;
    width: 100%;
    z-index: 5;
    filter: brightness(0.75) saturate(0.9);
  }
  #forest-front {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    z-index: 7;
  }
  #ground {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 16%;
    background: linear-gradient(180deg, #6fae4a 0%, #4f8f3a 40%, #3d7530 100%);
    z-index: 6;
    border-top: 3px solid #5a9840;
  }
  #ground::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(circle, #ffffff22 1px, transparent 1px);
    background-size: 14px 14px;
    opacity: 0.5;
  }

  nav {
    position: relative;
    z-index: 20;
    display:flex; justify-content:center; gap:12px;
    padding:16px 10px 0; flex-wrap:wrap;
  }
  nav a {
    text-decoration:none;
    background:rgba(255,255,255,0.85);
    border:3px solid var(--pink-deep);
    color:var(--pink-deep);
    font-weight:bold;
    padding:8px 18px;
    border-radius:20px;
    font-size:0.95em;
    transition: transform .15s ease, background .15s ease;
  }
  nav a:hover { transform: translateY(-2px) scale(1.05); background:var(--pink-soft); }
  nav a.active { background:var(--pink-deep); color:white; }

  h1 {
    position: relative;
    z-index: 20;
    text-align: center;
    color: white;
    text-shadow: 2px 2px 0 var(--pink-deep), 0 0 20px rgba(255,255,255,0.5);
    font-size: 2.1em;
    padding-top: 10px;
    margin: 0;
    letter-spacing: 1px;
    animation: bounce-title 2s ease-in-out infinite;
  }
  @keyframes bounce-title {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }

  .sub {
    position: relative;
    z-index: 20;
    text-align: center;
    color: #fff0f7;
    font-size: 1em;
    margin-top: 4px;
    text-shadow: 1px 1px 0 var(--pink-deep);
  }

  #clock {
    position: absolute;
    top: 14px;
    right: 18px;
    z-index: 20;
    background: rgba(255,255,255,0.75);
    border: 2px solid var(--pink-deep);
    border-radius: 14px;
    padding: 5px 12px;
    font-size: 0.85em;
    font-weight: bold;
    color: #a3216b;
  }

  .animal {
    position: absolute;
    font-size: 46px;
    cursor: pointer;
    user-select: none;
    filter: drop-shadow(2px 4px 3px rgba(0,0,0,0.25));
    transition: transform 0.15s ease, filter 3s ease;
    will-change: transform;
    z-index: 10;
  }
  .animal:hover { transform: scale(1.25) rotate(-8deg); }
  .animal.clicked { animation: pop 0.4s ease; }
  @keyframes pop {
    0% { transform: scale(1); }
    40% { transform: scale(1.5) rotate(10deg); }
    100% { transform: scale(1); }
  }

  .bubble {
    position: absolute;
    background: white;
    border: 3px solid var(--pink-deep);
    border-radius: 20px;
    padding: 10px 16px;
    font-size: 15px;
    color: #a3216b;
    font-weight: bold;
    max-width: 220px;
    text-align: center;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    z-index: 30;
    animation: bubble-in 0.35s ease, bubble-out 0.4s ease 2.2s forwards;
    pointer-events: none;
  }
  .bubble::after {
    content: "";
    position: absolute;
    bottom: -12px;
    left: 30px;
    border-width: 12px 8px 0 8px;
    border-style: solid;
    border-color: var(--pink-deep) transparent transparent transparent;
  }
  @keyframes bubble-in {
    from { opacity: 0; transform: translateY(10px) scale(0.8); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes bubble-out {
    to { opacity: 0; transform: translateY(-10px) scale(0.9); }
  }

  .heart {
    position: absolute;
    font-size: 20px;
    pointer-events: none;
    animation: rise 1.2s ease-out forwards;
    z-index: 29;
  }
  @keyframes rise {
    0% { opacity: 1; transform: translateY(0) scale(0.6) rotate(0deg); }
    100% { opacity: 0; transform: translateY(-70px) scale(1.2) rotate(30deg); }
  }

  footer {
    position: absolute;
    bottom: 6px;
    width: 100%;
    text-align: center;
    color: #ffffffdd;
    font-size: 0.75em;
    z-index: 20;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
  }
</style>
</head>
<body>
<div id="scene">
  <div id="sky"></div>
  <div id="stars"></div>
  <div id="celestial"></div>
  <div id="forest-back"></div>
  <div id="ground"></div>
  <div id="forest-front"></div>
  <div id="light-overlay"></div>

  <nav>
    <a href="accueil.html">🌟 Accueil</a>
    <a href="animaux-compliments.html" class="active">🏡 Jardin</a>
    <a href="jeu-compter.html">🔢 Compter</a>
    <a href="couleurs.html">🎨 Couleurs</a>
    <a href="bibliotheque.html">📚 Comptines</a>
  </nav>

  <h1>🌸 Le Jardin des Compliments 🌸</h1>
  <div class="sub">Clique sur un petit animal pour recevoir un compliment tout doux 💕</div>
  <div id="clock"></div>
  <footer>Fait avec amour 🎀</footer>
</div>

<script>
const scene = document.getElementById('scene');
const sky = document.getElementById('sky');
const starsEl = document.getElementById('stars');
const celestial = document.getElementById('celestial');
const overlay = document.getElementById('light-overlay');
const forestBack = document.getElementById('forest-back');
const forestFront = document.getElementById('forest-front');
const clockEl = document.getElementById('clock');

function rand(min, max) { return Math.random() * (max - min) + min; }
function pad(n){ return n.toString().padStart(2,'0'); }

/* ---------- TREES (SVG generation) ---------- */
function pineTree(x, baseY, scale, shade) {
  const trunkW = 6 * scale, trunkH = 14 * scale;
  const w = 30 * scale;
  return `
    <g transform="translate(${x},${baseY})">
      <rect x="${-trunkW/2}" y="${-trunkH}" width="${trunkW}" height="${trunkH}" fill="#5b3a29"/>
      <polygon points="0,${-trunkH-70*scale} ${-w},${-trunkH-10*scale} ${w},${-trunkH-10*scale}" fill="${shade}"/>
      <polygon points="0,${-trunkH-55*scale} ${-w*0.8},${-trunkH+2*scale} ${w*0.8},${-trunkH+2*scale}" fill="${shade}"/>
      <polygon points="0,${-trunkH-38*scale} ${-w*0.65},${-trunkH+10*scale} ${w*0.65},${-trunkH+10*scale}" fill="${shade}"/>
    </g>`;
}

function roundTree(x, baseY, scale, shade) {
  const trunkW = 7 * scale, trunkH = 16 * scale;
  return `
    <g transform="translate(${x},${baseY})">
      <rect x="${-trunkW/2}" y="${-trunkH}" width="${trunkW}" height="${trunkH}" fill="#6b4a35"/>
      <ellipse cx="0" cy="${-trunkH-30*scale}" rx="${30*scale}" ry="${26*scale}" fill="${shade}"/>
      <ellipse cx="${-14*scale}" cy="${-trunkH-18*scale}" rx="${18*scale}" ry="${16*scale}" fill="${shade}"/>
      <ellipse cx="${14*scale}" cy="${-trunkH-16*scale}" rx="${18*scale}" ry="${15*scale}" fill="${shade}"/>
    </g>`;
}

function buildForest(el, count, minScale, maxScale, shades) {
  let svgContent = '';
  const width = 1400;
  for (let i = 0; i < count; i++) {
    const x = (width / count) * i + rand(-20, 20);
    const scale = rand(minScale, maxScale);
    const shade = shades[Math.floor(Math.random() * shades.length)];
    svgContent += Math.random() > 0.45 ? pineTree(x, 100, scale, shade) : roundTree(x, 100, scale, shade);
  }
  el.innerHTML = `<svg viewBox="0 0 ${width} 130" preserveAspectRatio="none" width="100%" height="100%">${svgContent}</svg>`;
}

buildForest(forestBack, 14, 0.6, 0.95, ['#3f6b3a', '#356030', '#2f5a2c']);
buildForest(forestFront, 8, 1.1, 1.6, ['#4c8a3f', '#427a37', '#3a6d30']);
forestFront.style.height = '22%';
forestBack.style.height = '18%';
forestFront.querySelector('svg').setAttribute('viewBox','0 0 1400 160');

/* ---------- STARS ---------- */
for (let i = 0; i < 60; i++) {
  const s = document.createElement('div');
  s.className = 'star';
  s.style.left = rand(0, 100) + '%';
  s.style.top = rand(0, 55) + '%';
  s.style.animationDelay = rand(0, 3) + 's';
  starsEl.appendChild(s);
}

/* ---------- CLOUDS ---------- */
const cloudEls = [];
for (let i = 0; i < 4; i++) {
  const c = document.createElement('div');
  c.className = 'cloud';
  c.textContent = '☁️';
  c.style.top = rand(5, 25) + '%';
  c.style.left = '-10%';
  c.style.animationDuration = rand(35, 65) + 's';
  c.style.animationDelay = rand(0, 25) + 's';
  scene.appendChild(c);
  cloudEls.push(c);
}

/* ---------- BIRDS ---------- */
const birdEls = [];
for (let i = 0; i < 3; i++) {
  const b = document.createElement('div');
  b.className = 'bird';
  b.textContent = '🕊️';
  b.style.top = rand(10, 30) + '%';
  b.style.left = '-10%';
  b.style.animationDuration = rand(18, 30) + 's';
  b.style.animationDelay = rand(0, 15) + 's';
  scene.appendChild(b);
  birdEls.push(b);
}

/* ---------- FIREFLIES ---------- */
const fireflyEls = [];
for (let i = 0; i < 16; i++) {
  const f = document.createElement('div');
  f.className = 'firefly';
  f.style.left = rand(5, 95) + '%';
  f.style.top = rand(60, 88) + '%';
  f.style.animationDuration = rand(4, 8) + 's';
  f.style.animationDelay = rand(0, 5) + 's';
  scene.appendChild(f);
  fireflyEls.push(f);
}

/* ---------- CYCLE JOUR / NUIT ---------- */
function hexLerp(a, b, t) {
  const ah = parseInt(a.slice(1), 16), bh = parseInt(b.slice(1), 16);
  const ar = (ah >> 16) & 255, ag = (ah >> 8) & 255, ab = ah & 255;
  const br = (bh >> 16) & 255, bg = (bh >> 8) & 255, bb = bh & 255;
  const r = Math.round(ar + (br - ar) * t);
  const g = Math.round(ag + (bg - ag) * t);
  const bl = Math.round(ab + (bb - ab) * t);
  return `rgb(${r},${g},${bl})`;
}

const timePoints = [
  { h: 0,    top: '#0b1026', bottom: '#1b2a4a', bright: 0.12, sun: false },
  { h: 5,    top: '#141a3d', bottom: '#2c3660', bright: 0.18, sun: false },
  { h: 6.5,  top: '#ff9a76', bottom: '#ffd9a0', bright: 0.55, sun: true  },
  { h: 8,    top: '#6ec3e8', bottom: '#dff3ff', bright: 0.85, sun: true  },
  { h: 12,   top: '#3f9fe0', bottom: '#cdeeff', bright: 1.0,  sun: true  },
  { h: 16,   top: '#57a6d8', bottom: '#ffe6b8', bright: 0.9,  sun: true  },
  { h: 18.5, top: '#ff7e5f', bottom: '#ffc978', bright: 0.55, sun: true  },
  { h: 20,   top: '#3b2f5e', bottom: '#a85b8f', bright: 0.3,  sun: false },
  { h: 22,   top: '#151a3d', bottom: '#2a2a55', bright: 0.18, sun: false },
  { h: 24,   top: '#0b1026', bottom: '#1b2a4a', bright: 0.12, sun: false }
];

function getFrame(hourFloat) {
  for (let i = 0; i < timePoints.length - 1; i++) {
    const p1 = timePoints[i], p2 = timePoints[i + 1];
    if (hourFloat >= p1.h && hourFloat <= p2.h) {
      const t = (hourFloat - p1.h) / (p2.h - p1.h);
      return {
        top: hexLerp(p1.top, p2.top, t),
        bottom: hexLerp(p1.bottom, p2.bottom, t),
        bright: p1.bright + (p2.bright - p1.bright) * t,
        sun: t < 0.5 ? p1.sun : p2.sun
      };
    }
  }
  return timePoints[0];
}

function updateSceneForTime() {
  const now = new Date();
  const hourFloat = now.getHours() + now.getMinutes() / 60;
  const frame = getFrame(hourFloat);

  sky.style.background = `linear-gradient(180deg, ${frame.top} 0%, ${frame.bottom} 75%)`;
  overlay.style.background = frame.bright < 0.5 ? '#1a1a3a' : '#ffdca0';
  overlay.style.opacity = frame.bright < 0.5 ? (0.55 - frame.bright * 0.4) : (0.35 - frame.bright * 0.3);

  starsEl.style.opacity = Math.max(0, 1 - frame.bright * 1.6);

  const isDay = hourFloat > 6 && hourFloat < 19.5;
  const periodStart = isDay ? 6 : 19.5;
  const periodEnd = isDay ? 19.5 : 30; // 30 = 6 + 24 pour boucler la nuit
  let h = hourFloat;
  if (!isDay && h < 6) h += 24;
  const progress = Math.min(1, Math.max(0, (h - periodStart) / (periodEnd - periodStart)));

  const arcX = 8 + progress * 84;
  const arcY = 55 - Math.sin(progress * Math.PI) * 45;

  celestial.style.left = arcX + '%';
  celestial.style.top = arcY + '%';

  if (isDay) {
    celestial.style.background = 'radial-gradient(circle at 35% 35%, #fff7d6, #ffd558 60%, #ffb703)';
    celestial.style.boxShadow = '0 0 60px 20px rgba(255,213,88,0.7)';
  } else {
    celestial.style.background = 'radial-gradient(circle at 35% 35%, #ffffff, #e2e8f5 60%, #b9c3e0)';
    celestial.style.boxShadow = '0 0 40px 14px rgba(220,225,255,0.5)';
  }

  const nightMode = frame.bright < 0.35;
  fireflyEls.forEach(f => f.style.display = nightMode ? 'block' : 'none');
  birdEls.forEach(b => b.style.display = (isDay && frame.bright > 0.5) ? 'block' : 'none');
  cloudEls.forEach(c => {
    c.style.opacity = nightMode ? 0.25 : 0.75;
    c.style.filter = nightMode ? 'brightness(0.4)' : 'none';
  });

  const label = ['🌙 Nuit','🌅 Aube','🌇 Aube','☀️ Matin','☀️ Journée','🌤️ Après-midi','🌆 Coucher de soleil','🌌 Crépuscule','🌙 Nuit','🌙 Nuit'];
  let idx = timePoints.findIndex((p,i) => i < timePoints.length-1 && hourFloat >= p.h && hourFloat <= timePoints[i+1].h);
  clockEl.textContent = `${label[idx] || '🌙 Nuit'} — ${pad(now.getHours())}:${pad(now.getMinutes())}`;
}

updateSceneForTime();
setInterval(updateSceneForTime, 60000);

/* ---------- ANIMAUX ---------- */
const animalsEmoji = ['🐰','🐱','🐶','🐻','🦊','🐼','🐨','🐹','🐷','🦋','🐤','🐿️'];

const compliments = [
  "Tu illumines chaque pièce dans laquelle tu entres ✨",
  "Ton sourire est absolument contagieux 😄",
  "Tu es plus fort(e) que tu ne le penses 💪",
  "Ta créativité n'a pas de limites 🎨",
  "Tu mérites tout le bonheur du monde 🌈",
  "Quelqu'un pense à toi en ce moment même 💭",
  "Tu as un cœur incroyablement généreux 💖",
  "Ta présence rend le monde meilleur 🌍",
  "Tu es unique, et c'est ta plus grande force 🌟",
  "Aujourd'hui est un bon jour pour être toi 🌸",
  "Tu inspires les autres sans même le savoir 🕊️",
  "Ton énergie est un vrai cadeau pour ceux qui t'entourent 🎁",
  "Tu fais un travail incroyable, continue comme ça 🚀",
  "Tu as beaucoup plus de valeur que tu ne l'imagines 💎",
  "Ton rire est l'une des plus belles mélodies 🎶",
  "Tu es capable de choses extraordinaires 🌠",
  "Ta gentillesse ne passe jamais inaperçue 🤍",
  "Tu rends ce monde un peu plus doux, juste en existant 🍬",
  "Tu as le droit d'être fier(e) de ton chemin parcouru 🏆",
  "Quelqu'un, quelque part, est reconnaissant de t'avoir 🌷"
];

const NUM_ANIMALS = 10;
const animals = [];

function createAnimal(emoji) {
  const el = document.createElement('div');
  el.className = 'animal';
  el.textContent = emoji;

  const state = {
    el,
    x: rand(5, 90),
    y: rand(60, 82),
    vx: rand(-0.05, 0.05) || 0.03,
    vy: rand(-0.02, 0.02) || 0.01
  };

  el.style.left = state.x + '%';
  el.style.top = state.y + '%';
  el.addEventListener('click', (e) => onAnimalClick(state, e));
  scene.appendChild(el);
  animals.push(state);
}

function onAnimalClick(state) {
  state.el.classList.remove('clicked');
  void state.el.offsetWidth;
  state.el.classList.add('clicked');

  const compliment = compliments[Math.floor(Math.random() * compliments.length)];

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = compliment;

  const rect = state.el.getBoundingClientRect();
  const sceneRect = scene.getBoundingClientRect();
  let left = rect.left - sceneRect.left;
  let top = rect.top - sceneRect.top - 70;

  left = Math.max(10, Math.min(left, sceneRect.width - 240));
  top = Math.max(10, top);

  bubble.style.left = left + 'px';
  bubble.style.top = top + 'px';
  scene.appendChild(bubble);
  setTimeout(() => bubble.remove(), 2700);

  for (let i = 0; i < 5; i++) {
    const h = document.createElement('div');
    h.className = 'heart';
    h.textContent = ['💕','💖','✨','🌸'][Math.floor(Math.random()*4)];
    h.style.left = (left + rand(0, 60)) + 'px';
    h.style.top = (top + 70 + rand(-10, 10)) + 'px';
    h.style.animationDelay = (i * 0.05) + 's';
    scene.appendChild(h);
    setTimeout(() => h.remove(), 1300);
  }
}

function animate() {
  animals.forEach(state => {
    state.x += state.vx;
    state.y += state.vy;

    if (state.x < 2 || state.x > 92) state.vx *= -1;
    if (state.y < 58 || state.y > 84) state.vy *= -1;

    state.el.style.left = state.x + '%';
    state.el.style.top = state.y + '%';
    state.el.style.transform = state.vx < 0 ? 'scaleX(-1)' : 'scaleX(1)';
  });
  requestAnimationFrame(animate);
}

const shuffled = [...animalsEmoji].sort(() => Math.random() - 0.5).slice(0, NUM_ANIMALS);
shuffled.forEach(createAnimal);
animate();
</script>
</body>
</html>
