<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>🔢 Apprends à compter en jouant</title>
<style>
  :root { --pink-deep:#e6398f; --pink-soft:#ffd6e8; }
  * { box-sizing:border-box; }
  html,body {
    margin:0; padding:0; min-height:100vh;
    font-family:'Comic Sans MS','Trebuchet MS',sans-serif;
    background: linear-gradient(160deg,#cdeeff,#a9e0ff 55%,#8fd3ff);
    overflow-x:hidden;
  }

  nav {
    display:flex; justify-content:center; gap:12px;
    padding:16px 10px; flex-wrap:wrap;
  }
  nav a {
    text-decoration:none;
    background:white;
    border:3px solid var(--pink-deep);
    color:var(--pink-deep);
    font-weight:bold;
    padding:8px 18px;
    border-radius:20px;
    font-size:0.95em;
    transition: transform .15s ease, background .15s ease;
  }
  nav a:hover { transform: translateY(-2px) scale(1.05); background:var(--pink-soft); }
  nav a.active { background:var(--pink-deep); color:white; }

  h1 { text-align:center; color:#155a8a; text-shadow:2px 2px 0 white; margin:4px 0; font-size:2em; }

  #tabs { display:flex; justify-content:center; gap:14px; margin:14px 0 6px; }
  .tab-btn {
    border:3px solid #155a8a; background:white; color:#155a8a;
    font-weight:bold; padding:10px 22px; border-radius:20px;
    cursor:pointer; font-size:1em;
  }
  .tab-btn.active { background:#155a8a; color:white; }

  .panel { display:none; max-width: 900px; margin: 10px auto 40px; padding: 0 16px; }
  .panel.active { display:block; }

  #target-banner {
    text-align:center;
    font-size:1.4em;
    color:#0a3d5c;
    background: white;
    border-radius:20px;
    padding:14px;
    max-width:500px;
    margin: 0 auto 20px;
    box-shadow:0 4px 10px rgba(0,0,0,0.12);
    font-weight:bold;
  }
  #target-banner .num { font-size:1.6em; color:var(--pink-deep); }

  #counter-big {
    text-align:center;
    font-size:3.5em;
    font-weight:bold;
    color:#0a3d5c;
    margin: 6px 0 18px;
    text-shadow: 2px 2px 0 white;
  }

  /* OBJETS */
  #objects-field {
    position:relative;
    min-height:320px;
    background: #eafff0;
    border-radius: 24px;
    border: 4px dashed #6bc98a;
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    justify-content:center;
    gap:20px;
    padding:30px;
  }
  .object {
    font-size: 3.2em;
    cursor:pointer;
    user-select:none;
    transition: transform .2s ease, opacity .2s ease;
  }
  .object:hover { transform: scale(1.15); }
  .object.counted {
    animation: lift 0.5s ease forwards;
    pointer-events:none;
  }
  @keyframes lift {
    0% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-40px) scale(1.3) rotate(10deg); }
    100% { transform: translateY(-15px) scale(1.1) rotate(0deg); opacity:0.55; }
  }

  /* BULLES */
  #bubble-field {
    position:relative;
    height:420px;
    background: linear-gradient(180deg,#d8f4ff,#bfeaff);
    border-radius:24px;
    border: 4px dashed #4fb8e0;
    overflow:hidden;
  }
  .bubble {
    position:absolute;
    bottom:-60px;
    border-radius:50%;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.9), rgba(140,210,255,0.55) 60%, rgba(90,180,240,0.4));
    border:2px solid rgba(255,255,255,0.8);
    cursor:pointer;
    animation: rise-bubble linear forwards;
    display:flex; align-items:center; justify-content:center;
    font-weight:bold; color:#0a3d5c; font-size:1em;
  }
  @keyframes rise-bubble {
    from { transform: translateY(0); }
    to { transform: translateY(-480px); }
  }
  .bubble.pop {
    animation: pop-bubble 0.3s ease forwards !important;
  }
  @keyframes pop-bubble {
    0% { transform: scale(1); opacity:1; }
    100% { transform: scale(1.6); opacity:0; }
  }

  #feedback {
    text-align:center;
    font-size:1.3em;
    color: #16824a;
    font-weight:bold;
    min-height: 34px;
    margin-top: 14px;
  }

  #confetti-layer {
    position:fixed; inset:0; pointer-events:none; z-index:200;
  }
  .confetti {
    position:absolute; font-size:1.8em;
    animation: confetti-fall 1.6s ease-in forwards;
  }
  @keyframes confetti-fall {
    from { transform: translateY(-20px) rotate(0deg); opacity:1; }
    to { transform: translateY(100vh) rotate(360deg); opacity:0; }
  }

  .new-round-btn {
    display:block; margin: 18px auto 0;
    background: var(--pink-deep); color:white; border:none;
    padding: 10px 24px; border-radius:20px; font-size:1em;
    font-weight:bold; cursor:pointer;
  }

  #decor-layer {
    position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden;
  }
  .decor-item {
    position:absolute;
    font-size: 1.4em;
    animation: decor-float linear infinite;
    opacity:0.6;
  }
  @keyframes decor-float {
    from { transform: translateY(10vh) translateX(0) rotate(0deg); opacity:0; }
    10%  { opacity:0.6; }
    90%  { opacity:0.6; }
    to   { transform: translateY(-110vh) translateX(-15px) rotate(-15deg); opacity:0; }
  }
  nav, h1, #tabs, .panel { position:relative; z-index:5; }
</style>
</head>
<body>
<div id="decor-layer"></div>

<nav>
  <a href="accueil.html">🌟 Accueil</a>
  <a href="animaux-compliments.html">🏡 Jardin</a>
  <a href="jeu-compter.html" class="active">🔢 Compter</a>
  <a href="couleurs.html">🎨 Couleurs</a>
  <a href="bibliotheque.html">📚 Comptines</a>
</nav>

<h1>🔢 Apprends à compter en t'amusant !</h1>

<div id="tabs">
  <button class="tab-btn active" data-tab="objects">🍎 Compter les objets</button>
  <button class="tab-btn" data-tab="bubbles">🫧 Éclater les bulles</button>
</div>

<!-- PANEL OBJETS -->
<div class="panel active" id="panel-objects">
  <div id="target-banner-objects" class="target">Combien de <span id="obj-name" class="num"></span> vois-tu ? Clique sur chacun pour les compter !</div>
  <div id="counter-objects" class="counter">0</div>
  <div id="objects-field"></div>
  <div id="feedback-objects" class="feedback"></div>
  <button class="new-round-btn" id="new-round-objects">🔄 Nouveau tour</button>
</div>

<!-- PANEL BULLES -->
<div class="panel" id="panel-bubbles">
  <div id="target-banner-bubbles" class="target">Fais éclater <span id="bubble-target-num" class="num"></span> bulles !</div>
  <div id="counter-bubbles" class="counter">0</div>
  <div id="bubble-field"></div>
  <div id="feedback-bubbles" class="feedback"></div>
</div>

<div id="confetti-layer"></div>

<script>
/* Reuse styling classes for banner/counter/feedback dynamically */
document.querySelectorAll('.target').forEach(t => { t.id && (t.className='target'); });
document.getElementById('target-banner-objects').classList.add('target');
document.querySelectorAll('div.target,div.counter,div.feedback').forEach(()=>{});

/* Apply shared visual classes via JS since duplicated ids used generic styles */
function styleAsBanner(el){ el.style.textAlign='center'; el.style.fontSize='1.4em'; el.style.color='#0a3d5c'; el.style.background='white'; el.style.borderRadius='20px'; el.style.padding='14px'; el.style.maxWidth='500px'; el.style.margin='0 auto 20px'; el.style.boxShadow='0 4px 10px rgba(0,0,0,0.12)'; el.style.fontWeight='bold'; }
function styleAsCounter(el){ el.style.textAlign='center'; el.style.fontSize='3.5em'; el.style.fontWeight='bold'; el.style.color='#0a3d5c'; el.style.margin='6px 0 18px'; }
function styleAsFeedback(el){ el.style.textAlign='center'; el.style.fontSize='1.3em'; el.style.color='#16824a'; el.style.fontWeight='bold'; el.style.minHeight='34px'; el.style.marginTop='14px'; }

['target-banner-objects','target-banner-bubbles'].forEach(id=>styleAsBanner(document.getElementById(id)));
['counter-objects','counter-bubbles'].forEach(id=>styleAsCounter(document.getElementById(id)));
['feedback-objects','feedback-bubbles'].forEach(id=>styleAsFeedback(document.getElementById(id)));
document.querySelectorAll('.num').forEach(n=>{ n.style.fontSize='1.6em'; n.style.color='var(--pink-deep)'; });

/* Tabs */
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
  });
});

function rand(min,max){ return Math.random()*(max-min)+min; }
function randInt(min,max){ return Math.floor(rand(min,max+1)); }

function launchConfetti(){
  const layer = document.getElementById('confetti-layer');
  const emojis = ['🎉','⭐','✨','🎈','🌟','💖'];
  for (let i=0;i<24;i++){
    const c = document.createElement('div');
    c.className='confetti';
    c.textContent = emojis[randInt(0,emojis.length-1)];
    c.style.left = rand(0,100)+'vw';
    c.style.animationDelay = rand(0,0.5)+'s';
    c.style.fontSize = rand(1.2,2.2)+'em';
    layer.appendChild(c);
    setTimeout(()=>c.remove(), 2200);
  }
}

/* ---------------- JEU OBJETS ---------------- */
const fruitBank = [
  {emoji:'🍎', name:'pommes'},
  {emoji:'🍌', name:'bananes'},
  {emoji:'🍓', name:'fraises'},
  {emoji:'🍇', name:'grappes de raisin'},
  {emoji:'🍊', name:'oranges'},
  {emoji:'🍉', name:'pastèques'},
  {emoji:'🐝', name:'abeilles'},
  {emoji:'🦋', name:'papillons'}
];

const objField = document.getElementById('objects-field');
const objNameEl = document.getElementById('obj-name');
const counterObjEl = document.getElementById('counter-objects');
const feedbackObjEl = document.getElementById('feedback-objects');

let objTotal = 0;
let objCounted = 0;

function newObjectsRound(){
  objField.innerHTML = '';
  feedbackObjEl.textContent = '';
  objCounted = 0;
  counterObjEl.textContent = '0';

  const fruit = fruitBank[randInt(0, fruitBank.length-1)];
  objTotal = randInt(3, 10);
  objNameEl.textContent = fruit.name;

  for (let i=0;i<objTotal;i++){
    const o = document.createElement('div');
    o.className = 'object';
    o.textContent = fruit.emoji;
    o.addEventListener('click', () => {
      if (o.classList.contains('counted')) return;
      o.classList.add('counted');
      objCounted++;
      counterObjEl.textContent = objCounted;
      if (objCounted === objTotal){
        feedbackObjEl.textContent = `Bravo ! Tu as compté jusqu'à ${objTotal} 🎉`;
        launchConfetti();
        setTimeout(newObjectsRound, 2200);
      }
    });
    objField.appendChild(o);
  }
}
document.getElementById('new-round-objects').addEventListener('click', newObjectsRound);
newObjectsRound();

/* ---------------- JEU BULLES ---------------- */
const bubbleField = document.getElementById('bubble-field');
const bubbleTargetEl = document.getElementById('bubble-target-num');
const counterBubEl = document.getElementById('counter-bubbles');
const feedbackBubEl = document.getElementById('feedback-bubbles');

let bubbleTarget = 5;
let bubblePopped = 0;
let bubbleSpawnTimer = null;
let roundActive = true;

function newBubbleRound(){
  bubblePopped = 0;
  roundActive = true;
  bubbleTarget = randInt(3, 10);
  bubbleTargetEl.textContent = bubbleTarget;
  counterBubEl.textContent = '0';
  feedbackBubEl.textContent = '';
  bubbleField.innerHTML = '';
}

function spawnBubble(){
  if (!roundActive) return;
  const b = document.createElement('div');
  b.className = 'bubble';
  const size = randInt(50, 85);
  b.style.width = size + 'px';
  b.style.height = size + 'px';
  b.style.left = rand(2, 88) + '%';
  const duration = rand(5, 9);
  b.style.animationDuration = duration + 's';
  b.textContent = (bubblePopped + 1) <= bubbleTarget ? '' : '';

  b.addEventListener('click', () => {
    if (b.classList.contains('pop') || !roundActive) return;
    b.classList.add('pop');
    bubblePopped++;
    counterBubEl.textContent = Math.min(bubblePopped, bubbleTarget);
    setTimeout(()=>b.remove(), 300);

    if (bubblePopped >= bubbleTarget){
      roundActive = false;
      feedbackBubEl.textContent = `Super ! Tu as éclaté ${bubbleTarget} bulles ! 🎉`;
      launchConfetti();
      bubbleField.querySelectorAll('.bubble').forEach(el => el.remove());
      setTimeout(newBubbleRound, 2200);
    }
  });

  b.addEventListener('animationend', () => {
    if (!b.classList.contains('pop')) b.remove();
  });

  bubbleField.appendChild(b);
}

newBubbleRound();
bubbleSpawnTimer = setInterval(spawnBubble, 900);

/* ---- Décor flottant ---- */
const decorLayer = document.getElementById('decor-layer');
const decorEmojis = ['🎈','⭐','🫧','🌤️','✨'];
for (let i=0;i<12;i++){
  const d = document.createElement('div');
  d.className = 'decor-item';
  d.textContent = decorEmojis[randInt(0, decorEmojis.length-1)];
  d.style.left = rand(0,96)+'%';
  d.style.fontSize = rand(1,2)+'em';
  d.style.animationDuration = rand(14,26)+'s';
  d.style.animationDelay = rand(0,20)+'s';
  decorLayer.appendChild(d);
}
</script>
</body>
</html>
